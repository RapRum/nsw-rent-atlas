<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5367d6"/></marker>
  <style>
    .bg{fill:#ffffff}.title{font:700 34px Arial,sans-serif;fill:#17243a}.sub{font:400 18px Arial,sans-serif;fill:#68778f}
    .box{fill:#f8faff;stroke:#d9e2f2;stroke-width:2}.box2{fill:#eef3ff;stroke:#cbd8ff;stroke-width:2}.box3{fill:#f7f9fc;stroke:#dce4ee;stroke-width:2}
    .head{font:700 19px Arial,sans-serif;fill:#1b2942}.body{font:400 15px Arial,sans-serif;fill:#66758d}.small{font:600 13px Arial,sans-serif;fill:#53627a;letter-spacing:1.2px}
    .arrow{fill:none;stroke:#5367d6;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#aab5c5;stroke-width:2;stroke-dasharray:7 7}
  </style>
</defs>
<rect class="bg" width="1400" height="760"/>
<text class="title" x="70" y="66">NSW Rent Atlas — Computational System Diagram</text>
<text class="sub" x="70" y="98">Source data → processing → web-ready dataset → interactive analytical outputs</text>

<text class="small" x="70" y="150">SOURCE DATA</text>
<rect class="box" x="70" y="175" width="340" height="125" rx="20"/>
<text class="head" x="95" y="212">NSW Rental Bond Lodgements</text>
<text class="body" x="95" y="244">weekly rent · dwelling type · postcode</text>
<text class="body" x="95" y="272">2025 rental observations</text>

<rect class="box" x="530" y="175" width="340" height="125" rx="20"/>
<text class="head" x="555" y="212">ABS Regional Population</text>
<text class="body" x="555" y="244">2021 and 2025 population estimates</text>
<text class="body" x="555" y="272">population growth (%)</text>

<rect class="box" x="990" y="175" width="340" height="125" rx="20"/>
<text class="head" x="1015" y="212">ABS Geography</text>
<text class="body" x="1015" y="244">postcode → LGA correspondence</text>
<text class="body" x="1015" y="272">LGA boundary geometry</text>

<path class="arrow" d="M240 300 C240 345, 470 345, 555 370"/>
<path class="arrow" d="M700 300 L700 365"/>
<path class="arrow" d="M1160 300 C1160 345, 930 345, 845 370"/>

<text class="small" x="70" y="382">PROCESSING</text>
<rect class="box2" x="420" y="365" width="560" height="120" rx="22"/>
<text class="head" x="455" y="404">Clean · aggregate · join · validate</text>
<text class="body" x="455" y="438">median rent by LGA × dwelling type · population growth · geographic match</text>
<text class="body" x="455" y="466">apply ≥30 rental-bond reliability threshold</text>

<path class="arrow" d="M700 485 L700 540"/>

<rect class="box2" x="520" y="540" width="360" height="110" rx="22"/>
<text class="small" x="550" y="572">WEB-READY DATASET</text>
<text class="head" x="550" y="608">dashboard_data.csv</text>
<text class="body" x="550" y="634">340 records · 121 LGAs · 4 dwelling types</text>

<path class="arrow" d="M610 650 C610 687, 455 687, 410 700"/>
<path class="arrow" d="M790 650 C790 687, 945 687, 990 700"/>

<rect class="box3" x="135" y="665" width="480" height="72" rx="18"/>
<text class="head" x="165" y="696">EXPLORE</text>
<text class="body" x="165" y="720">LGA map · rent · bonds · population context</text>

<rect class="box3" x="785" y="665" width="480" height="72" rx="18"/>
<text class="head" x="815" y="696">COMPARE</text>
<text class="body" x="815" y="720">growth–rent scatter · statewide evidence · LGA benchmarks</text>

<path class="dash" d="M1160 300 L1160 630 L1260 630"/>
<text class="body" x="1180" y="615">boundaries feed map only</text>
</svg>